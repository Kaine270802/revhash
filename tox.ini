[tox]
envlist = py39, py311, py312
isolated_build = true

[testenv]
deps =
    pytest
    pytest-cov
    ruff
    mypy
    brotli
    zstandard
commands =
    pytest --cov=revhash --cov-report=term-missing {posargs}
    ruff check src/revhash
    mypy src/revhash --ignore-missing-imports
    python scripts/build_embedded.py --check
