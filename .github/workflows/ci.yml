name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" brotli zstandard pytest-cov

      - name: Run tests with coverage
        run: pytest --cov=revhash --cov-report=term-missing

      - name: Lint with ruff
        run: ruff check src/revhash

      - name: Type-check with mypy
        run: mypy src/revhash --ignore-missing-imports

      - name: Verify embedded bundle freshness
        run: python scripts/build_embedded.py --check
